name: Opportunity search contract
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'test/*Search*'
      - 'test/opportunityAssessment*'
      - 'test/opportunityContext*'
      - 'test/jobWorkspaceNavigation*'
      - 'test/search*'
      - 'test/opportunitySearch/**'
      - 'package*.json'
      - '.github/workflows/opportunity-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run search:protocol:check
      - run: npm run test:search
      - run: npm run test:sql
      - run: npm run typecheck
