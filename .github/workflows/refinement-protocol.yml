name: Refinement prompt contract
on:
  pull_request:
    paths:
      - 'src/composables/applicationReference.ts'
      - 'src/composables/applicationRefinement.ts'
      - 'src/composables/refinementProtocolContract.ts'
      - 'src/refinementTypes.ts'
      - 'test/**'
      - 'supabase/**'
      - 'package*.json'
      - '.github/workflows/refinement-protocol.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:refinement-protocol
