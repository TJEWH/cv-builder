<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Motivation letter styling fixture</title>
    <style>
      .letter-fixture{max-width:1060px;margin:auto;padding:20px;color:var(--ui-text);font-family:var(--font-ui);font-size:14px;line-height:1.5;color-scheme:dark}
      .letter-fixture > h1{margin:0;font-size:22px;line-height:1.3}
      .letter-fixture__intro{margin:8px 0 16px;color:var(--ui-muted)}
      .letter-fixture__controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
      .letter-fixture__field{display:grid;gap:4px;font-size:13px}
      .letter-fixture__field select{min-height:40px;padding:8px;border:1px solid var(--ui-border);border-radius:6px;background:var(--ui-control);color:var(--ui-text);font:inherit}
      .letter-fixture__check{display:flex;align-items:center;gap:8px;min-height:40px}
      .letter-fixture__actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
      .letter-fixture__actions .btn{min-height:44px}
      .letter-fixture__meta{margin:0 0 12px;color:var(--ui-muted);font-size:13px}
      .letter-fixture__error{color:#fecaca}
      .letter-fixture__stage{height:min(1120px,calc(100dvh - 280px));min-height:440px}
      .letter-fixture__edit{margin-top:16px;border-top:1px solid var(--ui-divider);padding-top:12px}
      .letter-fixture__edit summary{cursor:pointer}
      .letter-fixture__edit label{display:grid;gap:4px;margin-top:12px}
      .letter-fixture__edit :is(input,textarea){width:100%;padding:10px;background:var(--ui-control);color:var(--ui-text);border:1px solid var(--ui-border);border-radius:6px;font:inherit;line-height:1.5}
      .letter-fixture__edit textarea{min-height:140px;resize:vertical}
      .letter-fixture__edit textarea[data-field="body"]{min-height:300px}
      .letter-fixture :is(select,input,textarea,summary):focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
      .letter-fixture ::selection{background:var(--ui-accent);color:var(--ui-control)}
      .letter-fixture__mobile-hint{display:none}
      @media(max-width:760px),(max-width:1180px) and (max-height:600px){.letter-fixture{padding:16px}.letter-fixture__stage{height:auto;min-height:0}.letter-fixture__mobile-hint{display:block;color:var(--ui-muted)}.letter-fixture__field{flex:1 1 140px}.letter-fixture__actions .btn{flex:1}}
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./motivation-letter.ts"></script></body>
</html>
