<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job workspace browser fixture</title>
    <style>
      .fixture-mobile-nav { display:none; }
      @media (max-width:760px) {
        .browser-workspace-fixture { --mobile-tabs-height:72px; --mobile-context-row-height:52px; padding:8px 8px 132px!important; }
        .fixture-toolbar { margin:0 0 8px!important; font-size:12px; }
        .fixture-toolbar > :not(strong) { display:none; }
        .fixture-mobile-nav { position:fixed; inset:auto 0 0; z-index:40; height:72px; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; background:#06141f; border-top:1px solid #134e4a; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./job-workspace.ts"></script>
  </body>
</html>
