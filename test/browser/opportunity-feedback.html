<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthetic opportunity feedback fixture</title>
    <style>
      .feedback-fixture { max-width:960px; padding:28px 32px; margin:auto; color:var(--ui-text); font-family:var(--font-ui); }
      .feedback-fixture h1 { font-size:22px; line-height:1.3; margin:0 0 8px; }
      .feedback-fixture > p { color:var(--ui-muted); font-size:13px; line-height:1.6; margin:0 0 24px; }
      .fixture-language { margin-bottom:16px; }
      .fixture-events { display:block; padding-top:18px; border-top:1px solid var(--ui-divider); color:var(--ui-muted); font-size:12px; line-height:1.7; overflow-wrap:anywhere; }
      @media(max-width:760px) { .feedback-fixture { padding:20px 16px; } }
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./opportunity-feedback.ts"></script></body>
</html>
